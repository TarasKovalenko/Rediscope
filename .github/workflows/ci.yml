name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Start Redis
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y redis-server
          else
            brew install redis
          fi
          redis-server --port 7799 --daemonize yes --save '' --appendonly no
          for _ in $(seq 1 20); do redis-cli -p 7799 ping && break; sleep 0.5; done

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        env:
          REDISCOPE_TEST_PORT: 7799
          # Keep the suite away from the developer's real connections file.
          REDISCOPE_HOME: ${{ runner.temp }}/rediscope-config
        run: cargo test --all-targets
