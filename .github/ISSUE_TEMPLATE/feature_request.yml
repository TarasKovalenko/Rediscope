name: Feature request
description: Suggest something rediscope should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task you have in front of you, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. Keys, screens and commands are all useful detail.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
      description: redis-cli, another client, a script. Optional.
  - type: checkboxes
    id: production
    attributes:
      label: Production
      options:
        - label: This would change data, so it needs to work with read-only and production profiles.
