[package]
name = "rediscope"
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI Redis client: browse keys as a tree, edit every value type, run raw commands."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TarasKovalenko/Rediscope"
homepage = "https://github.com/TarasKovalenko/Rediscope"
keywords = ["redis", "tui", "terminal", "cli", "database"]
categories = ["command-line-utilities", "database"]
exclude = [".github/*"]

[[bin]]
name = "rediscope"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
brotli-decompressor = "6"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
flate2 = "1.1.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = "4"
lz4_flex = "0.14.0"
quick-xml = "0.42"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
ratatui-textarea = "0.9"
redis = { version = "1", default-features = false, features = ["tokio-comp", "tls-rustls", "tls-rustls-insecure", "tokio-rustls-comp", "tls-rustls-webpki-roots", "streams", "acl", "script"] }
rmpv = "1.3.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ruzstd = "0.9.0"
serde = { version = "1", features = ["derive"] }
# preserve_order: pretty-printing a value must not silently reorder its keys.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "rediscope"
path = "src/lib.rs"

[target."cfg(unix)".dependencies]
libc = "0.2"
